name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sada
          POSTGRES_PASSWORD: sada
          POSTGRES_DB: sada
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Summarise failure
        if: failure()
        run: |
          {
            grep -E "\[ERROR\]|FAIL|Caused by|Exception|expected|Expected|but was" build.log | grep -v "^\s*at " | head -120
            for f in target/surefire-reports/*.txt; do [ -f "$f" ] && grep -E "FAIL|Exception|expected|Expected" "$f" | head -20; done
          } > failure.txt || true
          msg=$(sed 's/%/%25/g; s/\r//g' failure.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Backend build failed::${msg}"

  backend-docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t sada-api ./backend

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Summarise failure
        if: failure()
        run: |
          msg=$(grep -E "error|Error" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Frontend build failed::${msg}"
