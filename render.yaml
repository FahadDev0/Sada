# Render Blueprint — creates the API service on the free plan.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: sada-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Paste the Neon connection string (postgresql://...). Required.
      - key: DATABASE_URL
        sync: false
      # Random signing key for login tokens, generated by Render.
      - key: JWT_SECRET
        generateValue: true
      # Allowed frontend origins. Every *.vercel.app domain works out of the box.
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
      # Optional — enables the AI features (key from aistudio.google.com).
      - key: GEMINI_API_KEY
        sync: false
      # Optional — enables "Sign in with Google".
      - key: GOOGLE_CLIENT_ID
        sync: false
